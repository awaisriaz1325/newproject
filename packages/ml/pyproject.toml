[project]
name = "compback-ml"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "compback-core",
  "numpy>=2.2",
  "scikit-learn>=1.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compback_ml"]

[tool.uv.sources]
compback-core = { workspace = true }
