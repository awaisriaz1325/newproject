[project]
name = "compback-vault"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "compback-core",
  "cryptography>=44",
  "boto3>=1.37",
  "pypdfium2>=4.30",
  "pillow>=11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compback_vault"]

[tool.uv.sources]
compback-core = { workspace = true }
