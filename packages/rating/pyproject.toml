requires-python = ">=3.13"
dependencies = [
  "compback-core",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compback_rating"]

[tool.uv.sources]
compback-core = { workspace = true }
