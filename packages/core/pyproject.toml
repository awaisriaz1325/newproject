[project]
name = "compback-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.11",
  "pydantic-settings>=2.8",
  "sqlalchemy>=2.0.40",
  "psycopg[binary]>=3.2",
  "structlog>=25.1",
  "alembic>=1.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compback_core"]
