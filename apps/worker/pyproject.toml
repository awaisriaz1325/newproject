[project]
name = "compback-worker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "compback-core",
  "compback-vault",
  "compback-extract",
  "compback-rating",
  "compback-ml",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compback_worker"]

[tool.uv.sources]
compback-core = { workspace = true }
compback-extract = { workspace = true }
compback-ml = { workspace = true }
compback-rating = { workspace = true }
compback-vault = { workspace = true }
