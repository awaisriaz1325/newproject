[project]
name = "compback-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "compback-core",
  "compback-vault",
  "compback-extract",
  "compback-rating",
  "compback-disputes",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compback_api"]

[tool.uv.sources]
compback-core = { workspace = true }
compback-disputes = { workspace = true }
compback-extract = { workspace = true }
compback-rating = { workspace = true }
compback-vault = { workspace = true }
