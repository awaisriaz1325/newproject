# Fly.io config for the document worker (no public port). Same secrets as the API, plus
# COMPBACK_CLAMAV_HOST pointing at the ClamAV machine on the private network.
app = "compback-worker"
primary_region = "iad"

[build]
  dockerfile = "../docker/python.Dockerfile"

[processes]
  worker = "python -m compback_worker.main"

[env]
  COMPBACK_ENV = "prod"
  COMPBACK_STORAGE_BACKEND = "s3"
  COMPBACK_KMS_BACKEND = "aws"
  COMPBACK_LLM_PROVIDER = "anthropic"
  COMPBACK_BILLING_PROVIDER = "stripe"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
